name: Update satellites
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh orbital data from CelesTrak
        run: node incept-orbit-hero/scripts/update-satellites.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain incept-orbit-hero/data/satellites.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add incept-orbit-hero/data/satellites.txt
            git commit -m "chore: refresh satellite orbital data"
            git push
          else
            echo "No change in satellite data"
          fi
